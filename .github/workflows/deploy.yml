name: Build and Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "outputs/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: fsi-backend
  AZ_RG: fsi-rg
  AZ_LOCATION: malaysiawest
  ACR_NAME: fsizamboanga
  ACA_ENV: fsi-env
  ACA_APP: fsi-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tag
        id: meta
        run: echo "tag=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ---------- Azure login ----------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Get ACR login server
        id: acr
        run: |
          echo "server=$(az acr show -n ${{ env.ACR_NAME }} -g ${{ env.AZ_RG }} --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      # ---------- Build & push ----------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- Deploy to Container Apps ----------
      - name: Deploy to Azure Container Apps
        run: |
          IMAGE="${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          ACR_USER=$(az acr credential show -n ${{ env.ACR_NAME }} --query username -o tsv)
          ACR_PASS=$(az acr credential show -n ${{ env.ACR_NAME }} --query 'passwords[0].value' -o tsv)

          if az containerapp show -n ${{ env.ACA_APP }} -g ${{ env.AZ_RG }} >/dev/null 2>&1; then
            echo "Container app exists — updating"

            az containerapp secret set \
              -n ${{ env.ACA_APP }} -g ${{ env.AZ_RG }} \
              --secrets "fsi-api-key=${{ secrets.FSI_API_KEY }}"

            az containerapp registry set \
              -n ${{ env.ACA_APP }} -g ${{ env.AZ_RG }} \
              --server ${{ steps.acr.outputs.server }} \
              --username "$ACR_USER" \
              --password "$ACR_PASS"

            az containerapp update \
              -n ${{ env.ACA_APP }} -g ${{ env.AZ_RG }} \
              --image "$IMAGE" \
              --set-env-vars \
                "FSI_API_KEY=secretref:fsi-api-key" \
                "BASE_DIR=." \
                "PREPROCESS_DIR=./outputs/phase2"
          else
            echo "Container app missing — creating"

            az containerapp create \
              -n ${{ env.ACA_APP }} -g ${{ env.AZ_RG }} \
              --environment ${{ env.ACA_ENV }} \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --registry-server ${{ steps.acr.outputs.server }} \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --cpu 2.0 --memory 4.0Gi \
              --min-replicas 0 --max-replicas 3 \
              --secrets "fsi-api-key=${{ secrets.FSI_API_KEY }}" \
              --env-vars \
                "FSI_API_KEY=secretref:fsi-api-key" \
                "BASE_DIR=." \
                "PREPROCESS_DIR=./outputs/phase2"
          fi

      # ---------- Report ----------
      - name: Report URL
        run: |
          FQDN=$(az containerapp show -n ${{ env.ACA_APP }} -g ${{ env.AZ_RG }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Live: https://${FQDN}" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "URL: https://${FQDN}"