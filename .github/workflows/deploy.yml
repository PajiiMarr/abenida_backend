
name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "outputs/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitattributes"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: fsi-backend
  AZ_RG: fsi-rg
  AZ_LOCATION: malaysiawest
  ACR_NAME: fsizamboanga
  ACA_ENV: fsi-env
  ACA_APP: fsi-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Checkout repository and download actual Git LFS files
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Verify that the required raster files exist and are not LFS pointers
      - name: Verify aligned rasters
        shell: bash
        run: |
          set -euo pipefail

          RASTER_DIR="outputs/phase2/aligned"

          if [ ! -d "$RASTER_DIR" ]; then
            echo "ERROR: Raster directory not found: $RASTER_DIR"
            exit 1
          fi

          echo "Aligned raster files:"
          ls -lah "$RASTER_DIR"

          count=0

          for f in "$RASTER_DIR"/*.tif; do
            if [ ! -f "$f" ]; then
              continue
            fi

            count=$((count + 1))
            echo "Checking $f"

            if head -n 1 "$f" | grep -q "git-lfs.github.com/spec"; then
              echo "ERROR: $f is a Git LFS pointer, not the actual raster."
              exit 1
            fi

            file "$f"
          done

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No TIFF files found in $RASTER_DIR"
            exit 1
          fi

          echo "Verified $count TIFF files."

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Generate a unique image tag
      - name: Compute tag
        id: meta
        shell: bash
        run: |
          echo "tag=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" \
            >> "$GITHUB_OUTPUT"

      # 5. Authenticate with Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 6. Log in to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name "${{ env.ACR_NAME }}"

      # 7. Retrieve the ACR login server
      - name: Get ACR login server
        id: acr
        shell: bash
        run: |
          SERVER=$(az acr show \
            --name "${{ env.ACR_NAME }}" \
            --resource-group "${{ env.AZ_RG }}" \
            --query loginServer \
            --output tsv)

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"

      # 8. Build the image with the real raster files and push it to ACR
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Deploy the image to Azure Container Apps
      - name: Deploy to Azure Container Apps
        shell: bash
        env:
          ACR_SERVER: ${{ steps.acr.outputs.server }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          FSI_API_KEY: ${{ secrets.FSI_API_KEY }}
        run: |
          set -euo pipefail

          IMAGE="$ACR_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          ACR_USER=$(az acr credential show \
            --name "$ACR_NAME" \
            --query username \
            --output tsv)

          ACR_PASS=$(az acr credential show \
            --name "$ACR_NAME" \
            --query 'passwords[0].value' \
            --output tsv)

          if [ -z "$FSI_API_KEY" ]; then
            echo "ERROR: FSI_API_KEY GitHub secret is empty or missing."
            exit 1
          fi

          if az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZ_RG" \
            >/dev/null 2>&1; then

            echo "Container app exists — updating."

            az containerapp secret set \
              --name "$ACA_APP" \
              --resource-group "$AZ_RG" \
              --secrets "fsi-api-key=$FSI_API_KEY"

            az containerapp registry set \
              --name "$ACA_APP" \
              --resource-group "$AZ_RG" \
              --server "$ACR_SERVER" \
              --username "$ACR_USER" \
              --password "$ACR_PASS"

            az containerapp update \
              --name "$ACA_APP" \
              --resource-group "$AZ_RG" \
              --image "$IMAGE" \
              --set-env-vars \
                "FSI_API_KEY=secretref:fsi-api-key" \
                "BASE_DIR=." \
                "PREPROCESS_DIR=./outputs/phase2"

          else
            echo "Container app missing — creating."

            az containerapp create \
              --name "$ACA_APP" \
              --resource-group "$AZ_RG" \
              --environment "$ACA_ENV" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --registry-server "$ACR_SERVER" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --cpu 2.0 \
              --memory 4.0Gi \
              --min-replicas 0 \
              --max-replicas 3 \
              --secrets "fsi-api-key=$FSI_API_KEY" \
              --env-vars \
                "FSI_API_KEY=secretref:fsi-api-key" \
                "BASE_DIR=." \
                "PREPROCESS_DIR=./outputs/phase2"
          fi

      # 10. Report the deployed application URL
      - name: Report URL
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZ_RG" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "### Live: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://$FQDN"
